name: Test

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: android-actions/setup-android@v3

      - run: chmod +x gradlew

      - run: ./gradlew check
